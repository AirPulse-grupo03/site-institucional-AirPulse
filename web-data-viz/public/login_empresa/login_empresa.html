<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de empresas na plataforma AirPulse">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../css/global.css">
    <title>Cadastro de empresa | AirPulse</title>
</head>

<body>

    <!-- Cabeçalho principal da página -->
    <header class="cabecalho">

        <!-- Logo da AirPulse -->
        <a class="marca" href="#" aria-label="AirPulse - início">
            <span class="marca-logo">
                <img src="../assets/icon/logo-airpulse.png" alt="Logo AirPulse">
            </span>

            AirPulse
        </a>

        <!-- Acesso para quem já possui cadastro -->
        <div class="acesso-login">
            <span>Já tem conta?</span>
            <a href="#">Entrar</a>
        </div>

    </header>

    <main>

        <!-- Apresentação da página -->
        <div class="tipo-pagina">Cadastro de empresa</div>

        <h1>Comece a monitorar sua frota</h1>

        <p class="subtitulo">
            Preencha as informações da sua empresa para criar sua conta AirPulse.
        </p>


        <!-- Etapas que o usuário precisa concluir durante o cadastro -->
        <ol class="progresso-cadastro" aria-label="Progresso do cadastro">

            <li class="etapa-ativa">
                <span class="numero-etapa">1</span>
                <span>Dados da empresa</span>
            </li>

            <li>
                <span class="numero-etapa">2</span>
                <span>Endereço</span>
            </li>

            <li>
                <span class="numero-etapa">3</span>
                <span>Responsável</span>
            </li>

            <li>
                <span class="numero-etapa">4</span>
                <span>Confirmação</span>
            </li>

        </ol>


        <!-- Formulário principal de cadastro da empresa -->


    </main>

</body>

</html>
