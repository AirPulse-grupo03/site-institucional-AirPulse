<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/AirPulse__2_-removebg-preview.png">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/cadastroFuncionario.css">
    <title>Cadastro de Funcionário</title>
</head>
<body>
    <div class="header">
        <img class="Logo" src="assets/icon/AirPulse__2_-removebg-preview.png" width="55px">
        
        <div class="navbar">
            <a class="nav" href="index.html">
                <div>MENU</div>
            </a>
            <a class="nav" href="">
                <div>Sobre nós</div>
            </a>
        </div>

        <div class="acesso">
            <button class="btn-header" id="btn-cadastro">Cadastro</button>
            <button class="btn-header" id="btn-login">Login</button>
        </div>
    </div>

    <main class="container-cadastro">
        <div class="box-cadastro">
            <h1 class="titulo-cadastro">Cadastro de Funcionário</h1>
            <form class="form-cadastro">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Nome completo">
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Corporativo</label>
                        <input type="email" id="email" placeholder="nome@empresa.aero">
                    </div>

                    <div class="input-group">
                        <label for="data-nascimento">Data de Nascimento</label>
                        <input type="text" id="data-nascimento" placeholder="DD/MM/AAAA">
                    </div>

                    <div class="input-group">
                        <label for="cargo">Cargo</label>
                        <select id="cargo">
                            <option value="" disabled selected>Selecione o cargo</option>
                            <option value="piloto">Piloto</option>
                            <option value="comissario">Comissário</option>
                            <option value="mecanico">Mecânico</option>
                            <option value="atendente">Atendente</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00">
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
                    </div>

                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="+55 11 9 0000-0000">
                    </div>

                    <div class="input-group">
                        <label for="admin">Administrador</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="admin" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-voltar">Voltar</button>
                    <button type="button" class="btn-proximo">Próximo passo</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
