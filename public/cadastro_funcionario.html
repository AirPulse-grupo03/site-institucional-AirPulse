    <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
    </div>
    <main class="container-cadastro">
        <div class="box-cadastro">
            <h1 class="titulo-cadastro">Cadastro de Funcionário</h1>
            <form class="form-cadastro">
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome completo">
                </div>
                <div class="form-grid">

                    <div class="input-group">
                        <label for="email">Email Corporativo</label>
                        <input type="email" id="email" placeholder="nome@empresa.aero">
                    </div>

                    <div class="input-group">
                        <label for="data-nascimento">Data de Nascimento</label>
                        <input type="date" id="data_nascimento" placeholder="DD/MM/AAAA">
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00">
                    </div>

                    
                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="(11) 90000-0000">
                    </div>
                    
                    <div class="input-group">
                        <label for="cargo">Cargo*</label>
                        <select id="cargo" name="cargo" required class="select-cargo">
                            <option value="">Selecione</option>
                            <option>Administrador</option>
                            <option>Gestor de operações</option>
                            <option>Engenheiro de sistemas</option>
                            <option>Analista de monitoramento</option>
                            <option>Outro</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-voltar" onclick="voltar()">Voltar</button>
                    <button type="button" class="btn-proximo" onclick="cadastrar()">Cadastrar</button>
                </div>
            </form>
        </div>
    </main>

<script>

    function voltar() {
        setTimeout(() => {
            window.location = "index.html";
        }, "2000");
    }

    function cadastrar() {

        //var idEmpresa = sessionStorage.getItem("empresa")

        var nomeVar = nome.value;
        var emailVar = email.value;
        var dtNascimentoVar = data_nascimento.value;
        var cpfVar = limparCpf(cpf.value);
        var telefoneVar = limparTelefone(telefone.value);
        var cargoVar = cargo.value
        var senhaVar = senha.value;
        //var idEmpresaVar = idEmpresa;

        // if (
        //   nomeVar == "" ||
        //   emailVar == "" ||
        //   dtNascimentoVar == "" ||
        //   cpfVar == "" ||
        //   senhaVar == "" ||
        //   telefoneVar == "" ||
        //   idEmpresaVar == "" ||
        //   cargoVar == ""
        // ) {
        //   cardErro.style.display = "block";
        //   mensagem_erro.innerHTML =
        //     "(Mensagem de erro para todos os campos em branco)";

        //   finalizarAguardar();
        //   return false;
        // } 
        // else {
        //   setInterval(sumirMensagem, 5000);
        // }

        fetch("/cadastro_funcionario/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                dtNascimentoServer: dtNascimentoVar,
                cpfServer: cpfVar,
                senhaServer: senhaVar,
                telefoneServer: telefoneVar,
                cargoServer: cargoVar
                //idEmpresaServer: idEmpresaVar
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    cardErro.style.display = "block";

                    mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");

                    // limparFormulario();
                    // finalizarAguardar();
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                //finalizarAguardar();
            });

        return false;
    }

     function aplicarMascara(id, mascara) {
   const campo = document.querySelector(`#${id}`);

   campo.addEventListener("input", () => {
     campo.value = mascara(campo.value);
   });
 }

/* Máscara de CPF */
 aplicarMascara("cpf", valor => {
   return valor
     .replace(/\D/g, "")
     .slice(0, 11)
     .replace(/^(\d{3})(\d)/, "$1.$2")
     .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
     .replace(/\.(\d{3})(\d)/, ".$1-$2");
 });

 /* Máscara de telefone */
 aplicarMascara("telefone", valor => {
   return valor
     .replace(/\D/g, "")
     .slice(0, 11)
     .replace(/^(\d{2})(\d)/, "($1) $2")
     .replace(/(\d{5})(\d)/, "$1-$2");
});

function limparCpf(cpf){
    return cpf.replace(/\D/g, "");
}

function validarCpf(cpf){
    const cpfLimpo = limparCpf(cpf);
    return cpfLimpo.length === 11
}

function limparTelefone(telefone){
    return telefone.replace(/\D/g, "");
}

function validarTelefone(telefone){
    const telefoneLimpo = limparTelefone(telefone);
    return telefoneLimpo.length === 11
}
</script>
